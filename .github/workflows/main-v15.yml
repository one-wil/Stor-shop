name: Build StoreMaster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build StoreMaster V15 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Extract StoreMaster V15
        run: |
          rm -rf project
          mkdir -p project
          ZIP_FILE="StoreMaster-ADM-Launcher-v15-MediumPlus-Responsive-FINAL.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V15 ZIP file not found: $ZIP_FILE"
            ls -lah
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d project
          find project -maxdepth 6 -type f | sort

      - name: Locate Android project
        run: |
          SETTINGS_FILE=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Verify Android project
        run: |
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle" || test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "Android project verification: OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build StoreMaster V15 APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print

      - name: Upload StoreMaster V15 APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreMaster-ADM-APK-V15-MediumPlus-Responsive
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
